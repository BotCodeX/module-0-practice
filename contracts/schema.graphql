"""A work item exposed by the read-only GraphQL comparison endpoint."""
type WorkItem {
  id: ID!
  title: String!
  description: String
  owner: String!
  status: String!
  labels: [String!]!
  version: Int!
}

type Query {
  workItem(id: ID!): WorkItem
  workItems(limit: Int! = 20, status: String = null): [WorkItem!]!
}

