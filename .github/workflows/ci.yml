name: continuous-integration

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
      - "lab-11-work"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.33"
          python-version: "3.14.6"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src

      - name: Test
        run: >
          uv run pytest
          --cov
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=junit.xml

      - name: Export and check the API contract
        run: |
          mkdir -p build/contracts
          uv run python scripts/export_contract.py --output build/contracts/openapi.current.json
          uv run python scripts/check_openapi_compat.py contracts/openapi.baseline.json build/contracts/openapi.current.json
          uv run python scripts/export_contract.py --check

      - name: Build and checksum the package
        run: |
          uv build
          sha256sum dist/* > SHA256SUMS

      - name: Upload traceable evidence
        uses: actions/upload-artifact@v7
        with:
          name: module0-platform-api-${{ github.sha }}
          path: |
            dist/
            SHA256SUMS
            coverage.xml
            junit.xml
            build/contracts/openapi.current.json
          if-no-files-found: error
          retention-days: 14

